<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your proposal is your most sensitive asset — is your pricing tool treating it that way?">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111c34"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="sblue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7FFF"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="shield-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#5B7FFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B7FFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sbg)"/>

  <!-- subtle grid -->
  <g stroke="#5B7FFF" stroke-opacity="0.06">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- eyebrow + headline -->
  <g transform="translate(70,70)">
    <text x="0" y="0" fill="#5B7FFF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">PRICEIQ · SECURITY</text>
  </g>
  <text x="70" y="170" fill="white" font-family="Georgia,serif" font-size="44" font-weight="700">Your proposal is your</text>
  <text x="70" y="222" fill="white" font-family="Georgia,serif" font-size="44" font-weight="700">most sensitive asset.</text>
  <text x="70" y="285" fill="#9db4ff" font-family="Georgia,serif" font-size="26" font-style="italic">Is your pricing tool treating it that way?</text>

  <g transform="translate(70,340)" font-family="Inter,Arial,sans-serif" font-size="16">
    <g transform="translate(0,0)">
      <rect width="220" height="46" rx="23" fill="#16233f" stroke="#2a3a5c"/>
      <circle cx="28" cy="23" r="6" fill="#22c55e"/>
      <text x="48" y="29" fill="#cbd5e1">TLS 1.3 in transit</text>
    </g>
    <g transform="translate(0,62)">
      <rect width="220" height="46" rx="23" fill="#16233f" stroke="#2a3a5c"/>
      <circle cx="28" cy="23" r="6" fill="#22c55e"/>
      <text x="48" y="29" fill="#cbd5e1">AES-256 at rest</text>
    </g>
    <g transform="translate(0,124)">
      <rect width="220" height="46" rx="23" fill="#16233f" stroke="#2a3a5c"/>
      <circle cx="28" cy="23" r="6" fill="#22c55e"/>
      <text x="48" y="29" fill="#cbd5e1">NIST-aligned</text>
    </g>
  </g>

  <!-- shield + lock -->
  <g transform="translate(840,315)">
    <ellipse cx="0" cy="0" rx="280" ry="280" fill="url(#shield-glow)"/>
    <g filter="url(#sglow)">
      <path d="M0 -150 L120 -105 V20 C120 110 60 168 0 200 C-60 168 -120 110 -120 20 V-105 Z"
            fill="#0f172a" stroke="url(#sblue)" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <!-- inner highlight -->
    <path d="M0 -130 L100 -92 V18 C100 96 50 148 0 176 C-50 148 -100 96 -100 18 V-92 Z"
          fill="#16233f" fill-opacity="0.6"/>
    <!-- lock -->
    <g transform="translate(0,-10)">
      <path d="M-34 0 a34 34 0 0 1 68 0" fill="none" stroke="#5B7FFF" stroke-width="10" stroke-linecap="round"/>
      <rect x="-46" y="0" width="92" height="74" rx="14" fill="url(#sblue)"/>
      <circle cx="0" cy="32" r="9" fill="#0B1120"/>
      <rect x="-4" y="36" width="8" height="22" rx="4" fill="#0B1120"/>
    </g>
  </g>
</svg>
