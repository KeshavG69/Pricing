<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The manual pricing pipeline: every step is a place an error can hide">
  <defs>
    <linearGradient id="ppblue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B7FFF"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="280" rx="20" fill="#0B1120"/>
  <text x="500" y="50" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">Every step is a place an error can hide</text>

  <g font-family="Inter,Arial,sans-serif">
    <!-- step template -->
    <g transform="translate(40,100)">
      <rect width="160" height="110" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="80" y="34" text-anchor="middle" fill="#5B7FFF" font-size="22" font-weight="800">1</text>
      <text x="80" y="64" text-anchor="middle" fill="white" font-size="14" font-weight="700">Extract</text>
      <text x="80" y="86" text-anchor="middle" fill="#94a3b8" font-size="12">labor categories</text>
    </g>
    <g transform="translate(240,100)">
      <rect width="160" height="110" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="80" y="34" text-anchor="middle" fill="#5B7FFF" font-size="22" font-weight="800">2</text>
      <text x="80" y="64" text-anchor="middle" fill="white" font-size="14" font-weight="700">Match SOC</text>
      <text x="80" y="86" text-anchor="middle" fill="#94a3b8" font-size="12">occupation codes</text>
    </g>
    <g transform="translate(440,100)">
      <rect width="160" height="110" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="80" y="34" text-anchor="middle" fill="#5B7FFF" font-size="22" font-weight="800">3</text>
      <text x="80" y="64" text-anchor="middle" fill="white" font-size="14" font-weight="700">Pull wages</text>
      <text x="80" y="86" text-anchor="middle" fill="#94a3b8" font-size="12">6M+ BLS records</text>
    </g>
    <g transform="translate(640,100)">
      <rect width="160" height="110" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="80" y="34" text-anchor="middle" fill="#5B7FFF" font-size="22" font-weight="800">4</text>
      <text x="80" y="64" text-anchor="middle" fill="white" font-size="14" font-weight="700">FBLR + escalation</text>
      <text x="80" y="86" text-anchor="middle" fill="#94a3b8" font-size="12">across all years</text>
    </g>
    <g transform="translate(840,100)">
      <rect width="120" height="110" rx="14" fill="#16233f" stroke="url(#ppblue)" stroke-width="2"/>
      <text x="60" y="34" text-anchor="middle" fill="#22c55e" font-size="22" font-weight="800">✓</text>
      <text x="60" y="64" text-anchor="middle" fill="white" font-size="14" font-weight="700">Compliant</text>
      <text x="60" y="86" text-anchor="middle" fill="#94a3b8" font-size="12">Excel volume</text>
    </g>
    <!-- connectors -->
    <g stroke="#334155" stroke-width="2">
      <path d="M200 155h40"/><path d="M400 155h40"/><path d="M600 155h40"/><path d="M800 155h40"/>
    </g>
  </g>
  <text x="500" y="252" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Map one role to the wrong SOC code and you price yourself out — or win work you can't deliver profitably.</text>
</svg>
